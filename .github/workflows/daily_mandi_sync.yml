name: Daily APMC Mandi Rates Sync

on:
  schedule:
    # 05:45 UTC = 11:15 AM IST (morning mandi arrivals)
    - cron: '45 5 * * *'
    # 08:35 UTC = 02:05 PM IST (midday updates)
    - cron: '35 8 * * *'
    # 10:15 UTC = 03:45 PM IST (afternoon auction closing)
    - cron: '15 10 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Zero-Error Pipeline & Anomaly Tests
        run: |
          python -m unittest test_pipeline.py

      - name: Run Daily Sync & Anomaly Shield Script
        env:
          DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}
        run: |
          python sync.py

      - name: Commit & Push Updated Data
        run: |
          git config --global user.name "systemiclogics-beep"
          git config --global user.email "systemiclogics-beep@users.noreply.github.com"
          git add today.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily mandi rates [$(date +'%Y-%m-%d %H:%M')]" && git push)

      - name: Purge jsDelivr Edge Cache
        run: |
          curl -s https://purge.jsdelivr.net/gh/systemiclogics-beep/mandi-rates@main/today.json || true

      - name: Verify CDN & Data Health Check
        run: |
          python -c "
          import json, os
          assert os.path.exists('today.json'), 'FATAL ERROR: today.json file missing!'
          with open('today.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          records = data.get('records', [])
          print(f'Data Health Check OK: {len(records)} active mandi records present. Date: {data.get(\"generated_at\")}')
          assert len(records) >= 50, f'FATAL ERROR: Ingestion anomaly detected, only {len(records)} records!'
          "
