name: Daily APMC Mandi Rates Sync

on:
  schedule:
    # 05:45 UTC = 11:15 AM IST (morning mandi arrivals)
    - cron: '45 5 * * *'
    # 08:35 UTC = 02:05 PM IST (midday updates)
    - cron: '35 8 * * *'
    # 10:15 UTC = 03:45 PM IST (afternoon auction closing)
    - cron: '15 10 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub UI

concurrency:
  group: daily-mandi-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Zero-Error Pipeline & Anomaly Tests
        run: |
          python -m unittest test_pipeline.py

      - name: Run Daily Sync & Anomaly Shield Script
        run: |
          python sync.py

      - name: Verify Data Health & Freshness Gate
        run: |
          python -c "
          import json, os, datetime
          assert os.path.exists('today.json'), 'FATAL ERROR: today.json file missing!'
          with open('today.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          records = data.get('records', [])
          gen_at = data.get('generated_at', '')
          print(f'Data Health Check: {len(records)} active mandi records present. Date: {gen_at}')
          now = datetime.datetime.now()
          # On non-Sundays, validate volume with soft-band for festive/low-volume days
          if now.weekday() != 6:
              if len(records) < 200:
                  raise AssertionError(f'FATAL ERROR: Ingestion anomaly detected, only {len(records)} records!')
              elif len(records) < 2000:
                  print(f'WARNING: Low trading volume detected ({len(records)} records). Proceeding for festive/partial trading day.')
              else:
                  print(f'SUCCESS: Healthy volume verified ({len(records)} records).')
          "

      - name: Commit & Push to Data Branch with Auto-Retry
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          cp today.json /tmp/today.json
          git fetch origin data
          git checkout data
          mv /tmp/today.json today.json
          git add today.json
          git diff --staged --quiet || (
            git commit -m "Auto-update daily mandi rates [$(date +'%Y-%m-%d %H:%M')]"
            for i in 1 2 3; do
              echo "Pushing to primary data branch (attempt $i)..."
              git push origin data && break || (echo "Push failed, waiting 5s..." && sleep 5)
            done
          )

      - name: Push to Backup Remote (Catalyst097)
        if: env.BACKUP_PAT != ''
        env:
          BACKUP_PAT: ${{ secrets.BACKUP_PAT }}
        run: |
          git remote add backup https://x-access-token:${{ secrets.BACKUP_PAT }}@github.com/Catalyst097/mandi-rates.git || true
          for i in 1 2 3; do
            echo "Pushing to Catalyst097 data branch (attempt $i)..."
            git push backup data:data --force && break || (echo "Backup push failed, waiting 5s..." && sleep 5)
          done

      - name: Purge jsDelivr Edge Cache
        run: |
          for i in 1 2 3; do
            echo "Purging jsDelivr cache for systemiclogics-beep@data/today.json (attempt $i)..."
            curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@data/today.json" && break || sleep 3
          done
          if [ -n "${{ secrets.BACKUP_PAT }}" ]; then
            for i in 1 2 3; do
              echo "Purging jsDelivr cache for Catalyst097@data/today.json (attempt $i)..."
              curl -s "https://purge.jsdelivr.net/gh/Catalyst097/mandi-rates@data/today.json" && break || sleep 3
            done
          fi

      - name: Alert on Failure (Telegram)
        if: failure() && env.TG_BOT_TOKEN != '' && env.TG_CHAT_ID != ''
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TG_CHAT_ID }}" \
            -d text="🔴 BharatMandi daily rates scraper failed! Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true

      - name: Create GitHub Issue on Failure (Audit Trail)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily Scraper Failure: Run ${context.runId}`,
              body: `Automated daily rates sync failed on run ${context.runId}.\n\nInspect logs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['scraper-failure', 'automated']
            });
