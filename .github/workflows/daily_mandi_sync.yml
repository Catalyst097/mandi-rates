name: Daily APMC Mandi Rates Sync

on:
  schedule:
    # 05:45 UTC = 11:15 AM IST (morning mandi arrivals)
    - cron: '45 5 * * *'
    # 08:35 UTC = 02:05 PM IST (midday updates)
    - cron: '35 8 * * *'
    # 10:15 UTC = 03:45 PM IST (afternoon auction closing)
    - cron: '15 10 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Zero-Error Pipeline & Anomaly Tests
        run: |
          python -m unittest test_pipeline.py

      - name: Run Daily Sync & Anomaly Shield Script
        run: |
          python sync.py

      - name: Commit & Push Updated Data
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add today.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily mandi rates [$(date +'%Y-%m-%d %H:%M')]" && git push)

      - name: Purge jsDelivr Edge Cache
        run: |
          curl -s https://purge.jsdelivr.net/gh/${{ github.repository }}@main/today.json || true

      - name: Verify CDN, Data Health & Freshness Check
        run: |
          python -c "
          import json, os, datetime
          assert os.path.exists('today.json'), 'FATAL ERROR: today.json file missing!'
          with open('today.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          records = data.get('records', [])
          gen_at = data.get('generated_at', '')
          print(f'Data Health Check OK: {len(records)} active mandi records present. Date: {gen_at}')
          assert len(records) >= 50, f'FATAL ERROR: Ingestion anomaly detected, only {len(records)} records!'
          now = datetime.datetime.now()
          today_str = now.strftime('%d-%m-%Y')
          if now.weekday() != 6 and now.hour >= 6:
              if today_str not in gen_at:
                  print(f'[WARN] Freshness Alert: today.json date ({gen_at}) has not updated to today ({today_str}) yet.')
              else:
                  print(f'[OK] Freshness Verified: today.json matches today ({today_str}).')
          "
